<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" ry="22" fill="#2D2D2D"/>
  
  <!-- Gold V mark / wallet chevron -->
  <polyline 
    points="22,30 50,68 78,30" 
    fill="none" 
    stroke="#FFE066" 
    stroke-width="12" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- Subtle gold dot accent -->
  <circle cx="50" cy="74" r="5" fill="#FFE066" opacity="0.5"/>
</svg>